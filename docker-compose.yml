# SPE 全栈一键启动（09 WP3 / 05 §10）。
# 端口按 09 D3：宿主 nginx 18081、backend 调试 18080、mysql 13306（容器内分别为 80 / 8080 / 3306）。
# 启动前需在本目录准备 .env（复制 .env.example 填写），密钥不入库（06 §6）。
services:
  mysql:
    # 派生镜像只补 Oracle Linux 安全 errata；数据卷与初始化脚本不变（03 §53 / 28 §11.3）
    build: ./docker/mysql
    image: spe-mysql:8.4
    container_name: spe-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-spe}
      # 应用专用账号的口令（03 §16 SEC-3）：应用不再用 root 连库
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?请在 .env 中设置 DB_APP_PASSWORD}
      DB_NAME: ${DB_NAME:-spe}
      TZ: UTC
    ports:
      # 宿主直连调试用（09 D3 与本地已有实例错开）
      # ⚠️ 绑回环而不是 0.0.0.0（03 §38 的 P1-4）：0.0.0.0 让任何远程者可绕过 nginx 直打后端，
      # 而 13306 是数据库端口——它一旦可达，SEC 边界就只剩"MySQL 口令"这一层。
      - "127.0.0.1:13306:3306"
    volumes:
      - spe-mysql-data:/var/lib/mysql
      # 最小权限账号的初始化脚本；**只在数据卷为空时执行**，已有卷需手工建号（见 11 §5.2）
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    # 资源上限（03 §16 的 PERF-5）：默认无上限时，单个容器能吃掉整机内存；
    # MySQL 8.4 默认 innodb_buffer_pool 128M，1g 足够演示规模。
    mem_limit: 1g

  backend:
    build: ./backend
    container_name: spe-backend
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-spe}
      # 应用以**最小权限账号**连库（03 §16 SEC-3）：限本库、无 GRANT/SUPER/FILE 等全局权限
      DB_USERNAME: spe_app
      DB_PASSWORD: ${DB_APP_PASSWORD:?请在 .env 中设置 DB_APP_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      # 部署形态：demo 只多加载 db/demo 的 V999 演示数据；prod 不设这个变量
      SPRING_PROFILES_ACTIVE: demo
      # 容器内监听端口由镜像的 ENV SERVER_PORT=8080 固定（宿主映射见 ports）
      TZ: UTC
    ports:
      # 直连后端调试用；与本地 `mvnw spring-boot:run` 同端口，二者不可同时占用。
      # ⚠️ 绑回环（03 §38 的 P1-4）：发布到 0.0.0.0 时，任何远程者都能带任意 X-Forwarded-For
      # 直打后端——在旧的 `forward-headers-strategy: framework` 下实测可伪造 audit_log.ip，
      # 并让 IP 维度的登录限流一次都不触发（25 个伪造 IP × 25 个账号 ⇒ 0 次 429）。
      - "127.0.0.1:18080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    # 512m 限额 + 镜像里的 -XX:MaxRAMPercentage=75（堆约 384m）：Spring Boot 应用实测常驻 200~300MB
    mem_limit: 512m

  nginx:
    build: ./frontend
    container_name: spe-nginx
    ports:
      - "18081:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    # 静态资源 + 反代，64m 足够（gzip 与连接缓冲都很少）
    mem_limit: 64m

volumes:
  # 显式钉名：compose 默认会给卷名加项目前缀（本目录会变成 specs_spe-mysql-data），
  # 而 05 §10 与 09 D3 约定的名字是 spe-mysql-data
  spe-mysql-data:
    name: spe-mysql-data
