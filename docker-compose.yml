# SPE 全栈一键启动（09 WP3 / 05 §10）。
# 端口按 09 D3：宿主 nginx 18081、backend 调试 18080、mysql 13306（容器内分别为 80 / 8080 / 3306）。
# 启动前需在本目录准备 .env（复制 .env.example 填写），密钥不入库（06 §6）。
services:
  mysql:
    image: mysql:8.4
    container_name: spe-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-spe}
      TZ: UTC
    ports:
      # 宿主直连调试用（09 D3 与本地已有实例错开）
      - "13306:3306"
    volumes:
      - spe-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: spe-backend
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-spe}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      # 容器内监听端口由镜像的 ENV SERVER_PORT=8080 固定（宿主映射见 ports）
      TZ: UTC
    ports:
      # 直连后端调试用；与本地 `mvnw spring-boot:run` 同端口，二者不可同时占用
      - "18080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  nginx:
    build: ./frontend
    container_name: spe-nginx
    ports:
      - "18081:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  # 显式钉名：compose 默认会给卷名加项目前缀（本目录会变成 specs_spe-mysql-data），
  # 而 05 §10 与 09 D3 约定的名字是 spe-mysql-data
  spe-mysql-data:
    name: spe-mysql-data
