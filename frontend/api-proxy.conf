# /api/ 与 /open/v1/ 共用的反代配置（03 §51 P2-4）：改一处即两处生效。
# 上游用「变量 + Docker 内置 DNS」动态解析：直接写 `proxy_pass http://backend:8080` 时，
# nginx 只在自身启动那一刻解析一次 IP；后端容器重建后 IP 变化，nginx 会持续 502，
# 直到它自己被重启（实测：重建 backend 后 login 502，`docker restart spe-nginx` 后立刻 200，见 04-033）。
resolver 127.0.0.11 valid=10s ipv6=off;
set $backend_upstream http://backend:8080;
proxy_pass $backend_upstream;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# 覆盖而非追加：用 $proxy_add_x_forwarded_for 时客户端自带的伪造值会留在最左，而后端
# forward-headers-strategy=framework 取最左值 → audit_log.ip 可被任意伪造（实测确证）。
# 本部署只有一层可信反代（nginx 直连客户端），故用真实来源覆盖。
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
