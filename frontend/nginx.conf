server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传体积上限：P3 的 Excel 导入会传文件，Nginx 默认 1m 会先被拦掉
    client_max_body_size 20m;

    # 压缩：前端产物是单文件主包（解包后 140KB+），不压缩会让首屏白等
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 后端 API：proxy_pass 不写尾部斜杠，保留完整路径（后端 Controller 挂在 /api/...）
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 开放 API：M6 生效，现在就配好 location（09 D3）
    location /open/v1/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 不代理 actuator（09 WP3）：显式 404，避免被下面的 SPA 回退吞成一个 200 的 HTML
    location /actuator/ {
        return 404;
    }

    # Vite 产物带内容哈希，可长期缓存；改版靠文件名变化，不靠过期。
    # 不用 expires 指令——它会再发一个 Cache-Control，与 add_header 形成两个同名头
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 入口文件必须每次校验，否则发版后用户拿到的仍是旧版本引用的旧产物
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA 回退：前端为路由级懒加载，刷新子路径需回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
