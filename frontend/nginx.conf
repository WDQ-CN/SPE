server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传体积上限：P3 的 Excel 导入会传文件，Nginx 默认 1m 会先被拦掉
    client_max_body_size 20m;

    # 后端 API：proxy_pass 不写尾部斜杠，保留完整路径（后端 Controller 挂在 /api/...）
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 开放 API：M6 生效，现在就配好 location（09 D3）
    location /open/v1/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 不代理 actuator（09 WP3）：显式 404，避免被下面的 SPA 回退吞成一个 200 的 HTML
    location /actuator/ {
        return 404;
    }

    # SPA 回退：前端为路由级懒加载，刷新子路径需回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
