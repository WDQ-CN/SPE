server {
    listen 80;
    server_name _;

    # 不暴露 nginx 版本（P5 清理；响应头的 Server 会变成 "nginx"）
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头 + CSP：集中维护在 snippets 片段里（为什么用 include 见该文件与 04-032）
    include /etc/nginx/snippets/security-headers.conf;

    # 上传体积上限：P3 的 Excel 导入会传文件，Nginx 默认 1m 会先被拦掉
    client_max_body_size 20m;

    # >20m 的请求由 nginx 在读完 body 前直接拒绝，后端 handler 根本到不了；默认响应是 HTML，
    # 前端拿不到业务码。用命名 location 返回与后端 IMPORT_FILE_TOO_LARGE 同码的 JSON（P5-W3）。
    error_page 413 = @too_large;
    location @too_large {
        default_type application/json;
        return 413 '{"code":2030,"message":"上传文件超过大小限制","data":null}';
    }

    # 压缩：前端产物是单文件主包（解包后 140KB+），不压缩会让首屏白等
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 后端 API：proxy_pass 不写尾部斜杠，保留完整路径（后端 Controller 挂在 /api/...）
    location /api/ {
        # 上游用「变量 + Docker 内置 DNS」动态解析：直接写 `proxy_pass http://backend:8080` 时，
        # nginx 只在**自身启动那一刻**解析一次 IP；后端容器重建后 IP 变化，nginx 会持续 502
        # 直到它自己被重启（实测：重建 backend 后 login 502，`docker restart spe-nginx` 后立刻 200，见 04-033）。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖而非追加：用 $proxy_add_x_forwarded_for 时客户端自带的伪造值会留在最左，而后端
        # forward-headers-strategy=framework 取最左值 → audit_log.ip 可被任意伪造（实测确证）。
        # 本部署只有一层可信反代（nginx 直连客户端），故用真实来源覆盖。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 开放 API：M6 生效，现在就配好 location（09 D3）
    location /open/v1/ {
        # 上游用「变量 + Docker 内置 DNS」动态解析：直接写 `proxy_pass http://backend:8080` 时，
        # nginx 只在**自身启动那一刻**解析一次 IP；后端容器重建后 IP 变化，nginx 会持续 502
        # 直到它自己被重启（实测：重建 backend 后 login 502，`docker restart spe-nginx` 后立刻 200，见 04-033）。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖而非追加：用 $proxy_add_x_forwarded_for 时客户端自带的伪造值会留在最左，而后端
        # forward-headers-strategy=framework 取最左值 → audit_log.ip 可被任意伪造（实测确证）。
        # 本部署只有一层可信反代（nginx 直连客户端），故用真实来源覆盖。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 不代理 actuator（09 WP3）：显式 404，避免被下面的 SPA 回退吞成一个 200 的 HTML
    location /actuator/ {
        return 404;
    }

    # Vite 产物带内容哈希，可长期缓存；改版靠文件名变化，不靠过期。
    # 不用 expires 指令——它会再发一个 Cache-Control，与 add_header 形成两个同名头
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # 本层有 add_header，故安全头要重新 include（不会从 server 继承，见 04-032）
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # 入口文件必须每次校验，否则发版后用户拿到的仍是旧版本引用的旧产物
    location = /index.html {
        add_header Cache-Control "no-cache";
        # 同上：本层有 Cache-Control，故安全头要重新 include
        include /etc/nginx/snippets/security-headers.conf;
    }

    # SPA 回退：前端为路由级懒加载，刷新子路径需回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
