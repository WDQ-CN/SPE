# 安全响应头（集中一处维护；由 nginx.conf 在 server 与各 location 里 include）。
#
# 为什么是 include 片段而不是在各处复制：nginx 的 add_header 有一条容易踩的规则——
# **当前层级只要出现任何 add_header，就不再继承上一层的 add_header**。于是 `location = /index.html`
# 里那句 Cache-Control 会让 server 级的安全头对它失效，`/`（try_files 回落）实测一个头都没有（04-032）。
# 集中成片段、每层 include，改一处即全体生效，不会漏（03 §16 的 SEC-2 修复 + SEC-4）。
#
# 注意：文件名不能是 *.conf 且不能放在 /etc/nginx/conf.d/ 下——那里会被主配置的 `include *.conf`
# 当成 server 配置加载。故放在 /etc/nginx/snippets/（nginx 官方惯例）。

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;

# CSP（03 §16 的 SEC-4）：
#   script-src 'self'  —— 只允许同源自托管脚本，杜绝内联脚本与第三方脚本，这是防 XSS 的主防线；
#   style-src 保留 'unsafe-inline' —— Element Plus 运行时会注入内联样式（popper 定位、CSS 变量），
#     收紧到 nonce/hash 需要改造前端构建，已登记 11 §9；
#   connect-src 'self' / img-src 允许 data:（Element Plus 图标） / object-src 'none' / frame-ancestors 'none'。
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
