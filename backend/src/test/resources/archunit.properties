# ArchUnit 配置（06 §5「豁免用 FreezingArchRule 登记」的前置条件）
#
# FreezingArchRule 需要写基线文件，而 ArchUnit 1.x 默认禁止创建新的违规存储；
# 不开这一项时，首次冻结会抛 StoreInitializationFailedException 而不是"自动记录基线"
# （实测于 archunit-junit5 1.5.0，见《04-开发小记》014）。
# 基线文件落在 freeze.store.default.path（默认 archunit_store/，相对模块工作目录），
# 用豁免时该目录必须随仓库提交，否则基线在别的机器上不存在、冻结规则会直接失败。
freeze.store.default.allowStoreCreation=true
