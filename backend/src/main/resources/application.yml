server:
  # 宿主直跑默认 18080：本机 8003–8102 被 Windows 保留（含 8080/8081），绑定直接失败（09 D3）。
  # 容器内由 Compose 用 SERVER_PORT=8080 覆盖，容器网络里不受 Windows 保留区间影响。
  port: ${SERVER_PORT:18080}
  # 经 Nginx 反代时按 X-Forwarded-For / X-Forwarded-Proto 还原客户端信息。
  # 不设它（Boot 3 默认 NONE）时 getRemoteAddr() 拿到的是 nginx 容器地址，audit_log.ip 就失去溯源意义。
  forward-headers-strategy: framework

spring:
  application:
    name: spe-backend
  datasource:
    # 开发期连本机容器映射端口 13306（09 D3）；Compose 内由环境变量覆盖为 service 名 :3306。
    # 时间口径（09 D3）：连接时区固定 UTC，与容器内 MySQL 的会话时区一致；应用内部一律用 Instant，
    # 前端按浏览器本地时区渲染。不设 serverTimezone/connectionTimeZone=LOCAL，否则库内时间戳会差 8 小时。
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:13306}/${DB_NAME:spe}?characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC
    username: ${DB_USERNAME:root}
    # 必填项，见 backend/README.md；未提供时会以空口令连接、以 MySQL 鉴权失败（1045）告终
    # ——实测 Boot 不会为缺省的占位符报错，所以这里保留显式空默认值，不做「无默认即报错」的假设
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      # 未知字段直接报错——Boot 默认是 false（**静默忽略**）。P2 深审实测：`POST /api/templates
      # {"name":"probe","weight":"abc"}` 里的 weight 不是 DTO 字段、被丢弃后请求仍判合法并**创建成功**。
      # 而 PUT 是全量覆盖语义（IndicatorMapper.update 把 9 个字段一并 SET）：前端一旦把 targetValue
      # 拼成 target、或漏传 standard，服务端不报错，而是把那列**静默写成 NULL**——DIRECT 指标的人工
      # 换算表就此丢失，而**发布校验不检查 standard**，审计里也只记「从 X 变成 null」，没人会想到是拼错字段。
      # 开启后这类拼写错误在入口就被 2001 拦下（03 §30 的 P1-2）。
      fail-on-unknown-properties: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        # 显式白名单，**绝不要写 "*"**：/actuator/env 与 /actuator/configprops 会把配置值原样打印，
        # 其中就有 JWT_SECRET，等于把签名密钥公开发布（03 §19 有专门一条守卫测试钉住这行）。
        # 三个端点里只有 health 免认证（容器 healthcheck 要用），metrics/prometheus 需 ADMIN（见 SecurityConfig）。
        include: health,metrics,prometheus
  endpoint:
    health:
      # 保持默认：不向未认证调用方展示 DB/磁盘等组件细节
      show-details: never
  # 度量导出：**只有具体 registry 的 `enabled` 会被 @ConditionalOnEnabledMetricsExport 认**。
  # 不写这一项时，即使 classpath 上有 micrometer-registry-prometheus、相关的条件类也齐全，
  # PrometheusMeterRegistry 也不会被创建——注入到业务里的会是 SimpleMeterRegistry，
  # /actuator/prometheus 直接 404。实测细节（04-047）：条件评估报告里那行写的是
  # `management.defaults.metrics.export.enabled is considered false`，但补一个 `defaults` 段写成 true
  # **并不管用**（那个键读出来始终是 false），必须写下面这个具体键才生效。
  # Simple 导出不用显式关：Prometheus registry 一旦先创建，SimpleMetricsExportAutoConfiguration 的
  # @ConditionalOnMissingBean(MeterRegistry) 会自动让位。
  prometheus:
    metrics:
      export:
        enabled: true

app:
  jwt:
    # 必须由环境变量提供；缺失或短于 32 字节时启动即失败（09 D6）
    secret: ${JWT_SECRET:}
    ttl: 2h
  # 登录失败限流（03 §16 的 SEC-5；参数外化见 03 §18）。四项都可按环境覆盖——
  # 阈值是运行期策略，改一个数字不该重新构建镜像；不写则回落代码默认值，行为与优化前一致。
  login-limiter:
    max-failures-per-account: ${LOGIN_MAX_FAILURES_PER_ACCOUNT:5}
    max-failures-per-ip: ${LOGIN_MAX_FAILURES_PER_IP:20}
    window: ${LOGIN_LOCK_WINDOW:15m}
    # 计数条目上限：防止「海量随机账号」把进程内存推高（满后不再为新 key 建档，已有 key 照常计数）
    max-entries: ${LOGIN_MAX_ENTRIES:100000}
